# Cas test de Shi et al. (2024, prépublication SSRN 5042640, NON RÉVISÉE) :
# centrale A-CAES de 100 MW / 600 MWh. Quatre compresseurs à rendement
# isentropique constant (86 %), les trois premiers à 200 °C de sortie, le
# quatrième jusqu'à la pression du réservoir plus 0,2 MPa ; refroidisseurs
# et réchauffeurs à eau sous pression (18 bar, pincement 10 K, 0,04 MPa de
# perte de charge) ; réservoir isochore adiabatique de 1,18 × 10^5 m3 entre
# 4 et 10 MPa ; trois turbines à rendement isentropique constant (90 %), la
# première en pression glissante. Références : tableau 4 (paramètres),
# figure 7 (états à 7 MPa), tableau 5 (RTE 67,64 %, 887,05 MWh consommés,
# 600 MWh produits, 5712,5 t d'air, 4193,7 t d'eau, compresseur 4 actif
# 7,04 h sur 8). Ce n'est pas une validation (aucune mesure) : c'est un
# cas test de changement d'échelle (critère du plan : < 2 %).

nom: shi_100MW
description: >
  Cas test de Shi 2024 : A-CAES de 100 MW avec eau sous pression et turbine
  en pression glissante, réservoir adiabatique de 118 000 m3 (4 à 10 MPa).

ambiance:
  T_amb: registre:shi.T_amb
  p_amb: registre:shi.p_amb
  humidite_relative: registre:ambiance.humidite_relative_essai

composants:
  compresseur:
    type: compresseur
    modele: isentropique
    debit_massique_aspire: registre:shi.debit_charge
    rendement_isentropique: registre:shi.compresseur.rendement_isentropique
    rendement_mecanique: registre:shi.rendement_mecanique
    rendement_electrique: registre:shi.rendement_electrique
    etages:
      - T_sortie: registre:shi.compresseur.T_sortie
      - T_sortie: registre:shi.compresseur.T_sortie
      - T_sortie: registre:shi.compresseur.T_sortie
      - {}   # le compresseur 4 prend le reste jusqu'au réservoir (+ 0,2 MPa)
  eau:
    # Les refroidisseurs et les réchauffeurs de Shi sont les échangeurs du
    # stockage d'eau : l'air est refroidi à T_eau_froide + 10 K et réchauffé
    # à T_eau_chaude − 10 K.
    type: stockage_chaleur
    modele: eau_sous_pression
    masse: registre:shi.masse_eau
    pression_cuve: registre:shi.eau.pression
    pincement: registre:shi.pincement
    perte_de_charge: registre:shi.perte_charge_echangeur
    T_initiale: registre:shi.T_eau_froide
    # Shi impose 30 °C à l'entrée des refroidisseurs : réservoir froid
    # maintenu à cette température (refroidissement du retour non modélisé).
    T_froid_maintenue: registre:shi.T_eau_froide
    marge_ebullition:
      valeur: 0
      unite: K
      source: Shi ne donne pas de marge ; l'eau chaude est à 190 °C pour 207 °C de saturation
  refroidisseur_4:
    # Shi refroidit la sortie du compresseur 4 (90 → 40 °C) : à cette
    # température l'eau ne vaudrait que 80 °C et diluerait le réservoir
    # chaud ; refroidisseur à pincement vers l'ambiant ici (hypothèse).
    type: refroidisseur
    modele: pincement
    pincement: registre:shi.pincement
    perte_de_charge: registre:shi.perte_charge_echangeur
  reservoir:
    type: reservoir_air
    modele: adiabatique
    volume: registre:shi.reservoir.volume
    surface:
      valeur: 11500
      unite: m2
      source: calcul personnel, sphère équivalente (36 π V²)^(1/3) ; sans effet avec le modèle adiabatique
    surpression_entree: registre:shi.perte_charge_entree_reservoir
    p_max: registre:shi.reservoir.pression_max
  detendeur:
    type: detente
    modele: pression_glissante
    p_min: registre:shi.reservoir.pression_min
  turbine:
    type: turbine
    modele: isentropique
    debit_massique: registre:shi.debit_decharge
    rendement_isentropique: registre:shi.turbine.rendement_isentropique
    rendement_mecanique: registre:shi.rendement_mecanique
    rendement_electrique: registre:shi.rendement_electrique
    etages:
      # turbine 1 en pression glissante : pas de p_entree
      - p_sortie: registre:shi.turbine.p_sortie_1
        T_entree_cible: registre:shi.turbine.T_entree
      - p_entree: registre:shi.turbine.p_entree_2
        p_sortie: registre:shi.turbine.p_sortie_2
        T_entree_cible: registre:shi.turbine.T_entree
      - p_entree: registre:shi.turbine.p_entree_3
        p_sortie: registre:shi.turbine.p_sortie_3
        T_entree_cible: registre:shi.turbine.T_entree
  attente:
    type: attente
    modele: sans_pertes
    duree:
      valeur: 4
      unite: h
      source: "Shi 2024, § 4 : cycle quotidien de 8 h de charge, 6 h de décharge, le reste au repos ; aucune perte modélisée"

charge:
  chaine: [compresseur.1, eau, compresseur.2, eau, compresseur.3, eau,
           compresseur.4, refroidisseur_4, reservoir]
  p_cible: registre:shi.reservoir.pression_max
  dt:
    valeur: 60
    unite: s
    source: choix numérique (charge de 8 h)
  duree_max:
    valeur: 12
    unite: h
    source: garde-fou

decharge:
  chaine: [reservoir, detendeur, eau, turbine.1, eau, turbine.2, eau,
           turbine.3]
  dt:
    valeur: 60
    unite: s
    source: choix numérique (décharge de 6 h)
  duree_max:
    valeur: 10
    unite: h
    source: garde-fou

simulation:
  mode: cycles
  attente: attente
  p_initiale: registre:shi.reservoir.pression_min
  nombre_max: 4
  tolerance: 0.005
